[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "uav_sim"
dynamic = ["version"]

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
version_scheme = "no-guess-dev"

[tool.ruff]
src = [
    "uav_sim",
    "tests",

]

[tool.ruff.lint]
select = ["I", "E"]